<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Секундомер — пробел: старт → запись → следующая попытка</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #171a2b;
      --muted: #8a91b4;
      --text: #e9ecff;
      --accent: #7aa2ff;
      --ring: #2c3356;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 70% -10%, #1a1f3a 0%, var(--bg) 45%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap {
      width: min(880px, 100%);
      display: grid;
      gap: 18px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid var(--ring);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .time {
      font-variant-numeric: tabular-nums lining-nums;
      font-weight: 700;
      letter-spacing: .5px;
      line-height: 1;
      font-size: clamp(40px, 10vw, 84px);
      user-select: none;
    }
    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .badge {
      border: 1px dashed var(--ring);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 14px;
      backdrop-filter: blur(6px);
    }
    .controls { display:flex; gap:10px; flex-wrap: wrap; }
    .card-header { display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap; }
    .card-header .muted { margin-bottom:0 !important; }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--ring);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: transform .05s ease, background .2s ease, border-color .2s ease;
    }
    button:active { transform: translateY(1px); }
    button.primary { border-color: var(--accent); }
    button:disabled { opacity:.45; cursor:not-allowed; transform:none; }

    select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--ring);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
    }

    .table-scroll { width:100%; overflow-x:auto; }
    table { width:100%; min-width:760px; border-collapse:collapse; }
    thead th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      padding: 10px 8px;
      border-bottom: 1px solid var(--ring);
    }
    tbody td {
      padding: 10px 8px;
      border-bottom: 1px dashed var(--ring);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.current-record td { background:rgba(255, 205, 74, .06); }
    tbody tr.current-record td:nth-child(5) { color:#ffd76a; font-weight:700; }
    .muted { color: var(--muted); }
      /* Row delete icon button */
    button.icon { background: transparent !important; border: none !important; box-shadow: none !important; padding: 4px 8px !important; border-radius: 8px !important; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
    button.icon:hover { background: rgba(255,255,255,.06); color: #ff8a8a; }
    button.icon:active { transform: none !important; }
      /* Countdown overlay */
    .countdown-overlay { position:absolute; inset: 0; display:flex; align-items:center; justify-content:center; background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.12)); border-radius: 16px; pointer-events: none; }
    .countdown-digit { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: .02em; font-size: clamp(48px, 15vw, 140px); color: var(--text); text-shadow: 0 4px 20px rgba(0,0,0,.45); }
    .controls .countdown { display:flex; align-items:center; gap:8px; color: var(--muted); border: 1px dashed var(--ring); padding: 8px 10px; border-radius: 12px; }
    .controls .countdown-prestart { margin-left: auto; }
    .controls .countdown input[type="range"] { accent-color: var(--accent); }
    .controls .countdown-min input { text-align: right; }
    .card { position: relative; }

    .session-bar { display:flex; gap:14px; align-items:flex-start; justify-content:space-between; margin-top:8px; flex-wrap:wrap; padding: 12px 14px; border: 1px dashed var(--ring); border-radius: 12px; background: rgba(255,255,255,.02); }
    .session-info { display:flex; flex-direction:column; gap:4px; min-width: 220px; }
    .session-status { font-weight: 700; font-variant-numeric: tabular-nums lining-nums; letter-spacing:.3px; }
    .session-remaining { font-size:13px; }
    .session-controls { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-left:auto; }
    .session-controls label { display:flex; flex-direction:column; gap:6px; font-size:12px; color: var(--muted); }
    .session-controls select { min-width: 140px; }

    .header-actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
    .mode-bar { display:grid; gap:12px; margin-top:16px; }
    .mode-selectors { display:grid; gap:10px; }
    .mode-group {
      display:grid;
      grid-template-columns:minmax(150px, .7fr) minmax(0, 2fr);
      gap:12px;
      align-items:center;
    }
    .mode-group-label { color:var(--muted); font-size:13px; }
    .mode-options {
      display:grid;
      grid-template-columns:repeat(var(--option-count), minmax(0, 1fr));
      gap:8px;
    }
    .mode-option { width:100%; padding:10px 12px; }
    .mode-option[aria-pressed="true"] {
      background:var(--accent);
      border-color:var(--accent);
      color:#0f1220;
      font-weight:700;
    }
    .mode-option:focus-visible { outline:2px solid #fff; outline-offset:2px; }
    .mode-summary { font-size:13px; color:var(--muted); text-align:left; }
    @media (max-width: 640px) {
      .mode-group { grid-template-columns:1fr; gap:6px; }
      .mode-options { grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); }
    }
    div#resultsCard {
        min-height: 600px;
    }
    .table-caption {
      caption-side: top;
      text-align: left;
      color: var(--muted);
      padding: 6px 8px 4px;
      font-size: 13px;
    }

    .victory-popup {
      --victory-accent:#ffd76a;
      --victory-accent-2:#ff9d5c;
      position:fixed;
      inset:0;
      z-index:1000;
      display:grid;
      place-items:center;
      overflow:auto;
      padding:20px;
      pointer-events:auto;
      background:
        radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--victory-accent) 24%, transparent), transparent 48%),
        rgba(8,10,20,.82);
      backdrop-filter:blur(10px);
    }
    .victory-popup[hidden] { display:none; }
    .victory-popup.show { animation:victoryBackdropIn .35s ease-out both; }
    .victory-card {
      position:relative;
      z-index:2;
      width:min(560px, 100%);
      padding:28px 28px 24px;
      text-align:center;
      border:1px solid color-mix(in srgb, var(--victory-accent) 76%, white);
      border-radius:26px;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--victory-accent) 10%, #252b4d), #12162b 64%);
      box-shadow:
        0 28px 90px rgba(0,0,0,.62),
        0 0 70px color-mix(in srgb, var(--victory-accent) 22%, transparent);
      animation:victoryCardIn .72s cubic-bezier(.16,1,.3,1) both;
    }
    .victory-badge {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:30px;
      padding:6px 12px;
      border:1px solid color-mix(in srgb, var(--victory-accent) 70%, transparent);
      border-radius:999px;
      color:var(--victory-accent);
      background:color-mix(in srgb, var(--victory-accent) 10%, transparent);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .victory-illustration {
      height:126px;
      margin:14px auto 2px;
      color:var(--victory-accent);
      filter:drop-shadow(0 12px 22px color-mix(in srgb, var(--victory-accent) 28%, transparent));
      animation:illustrationFloat 2.2s ease-in-out infinite;
    }
    .victory-illustration svg { display:block; width:100%; height:100%; }
    .victory-title {
      margin-top:6px;
      color:var(--victory-accent);
      font-size:clamp(30px, 7vw, 50px);
      font-weight:950;
      line-height:1.02;
      letter-spacing:.01em;
    }
    .victory-message { margin:12px auto 0; max-width:430px; color:var(--text); font-size:17px; line-height:1.4; }
    .victory-result { margin-top:12px; font-size:clamp(19px, 4vw, 27px); font-weight:800; }
    .victory-mode { margin-top:8px; color:var(--muted); font-size:14px; }
    .victory-actions { display:grid; grid-template-columns:1.35fr 1fr; gap:10px; margin-top:22px; }
    .victory-actions button { min-height:48px; }
    .victory-actions .primary {
      color:#101426;
      border-color:var(--victory-accent);
      background:linear-gradient(135deg, var(--victory-accent), var(--victory-accent-2));
      font-weight:800;
    }
    .victory-hint { margin-top:12px; color:var(--muted); font-size:12px; }
    .victory-confetti { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
    .confetti-piece {
      position:absolute;
      top:-12vh;
      width:10px;
      height:18px;
      border-radius:2px;
      animation:confettiFall var(--duration) linear var(--delay) both;
    }
    @keyframes victoryBackdropIn {
      from { opacity:0; }
      to { opacity:1; }
    }
    @keyframes victoryCardIn {
      0% { opacity:0; transform:scale(.62) translateY(36px) rotate(-2deg); }
      62% { opacity:1; transform:scale(1.04) translateY(0) rotate(.6deg); }
      100% { opacity:1; transform:scale(1) translateY(0) rotate(0); }
    }
    @keyframes illustrationFloat {
      0%, 100% { transform:translateY(0) rotate(-1deg); }
      50% { transform:translateY(-8px) rotate(1deg); }
    }
    @keyframes confettiFall {
      from { transform:translate3d(0, -12vh, 0) rotate(0deg); }
      to { transform:translate3d(var(--drift), 118vh, 0) rotate(900deg); }
    }
    @media (max-width:560px) {
      .victory-popup { padding:12px; }
      .victory-card { padding:22px 18px 18px; }
      .victory-illustration { height:104px; }
      .victory-actions { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="display">
        <div id="time" class="time" aria-live="polite" aria-atomic="true">00:00</div>
        <div class="badges">
          <div class="badge">Пробел — старт / завершить попытку</div>
          <div class="badge">После падения — одно нажатие</div>
        </div>
      </div>
      <div class="mode-bar">
        <div id="modeSelectors" class="mode-selectors">
          <div class="mode-group" role="group" aria-labelledby="ballsModeLabel">
            <div id="ballsModeLabel" class="mode-group-label">Количество мячей</div>
            <div class="mode-options" style="--option-count: 3">
              <button type="button" class="mode-option" data-mode="balls" data-value="2" aria-pressed="false">2 мяча</button>
              <button type="button" class="mode-option" data-mode="balls" data-value="3" aria-pressed="false">3 мяча</button>
              <button type="button" class="mode-option" data-mode="balls" data-value="4" aria-pressed="false">4 мяча</button>
            </div>
          </div>
          <div class="mode-group" role="group" aria-labelledby="handsModeLabel">
            <div id="handsModeLabel" class="mode-group-label">Режим рук</div>
            <div class="mode-options" style="--option-count: 3">
              <button type="button" class="mode-option" data-mode="hands" data-value="left" aria-pressed="false">Только левая</button>
              <button type="button" class="mode-option" data-mode="hands" data-value="right" aria-pressed="false">Только правая</button>
              <button type="button" class="mode-option" data-mode="hands" data-value="both" aria-pressed="false">Двумя руками</button>
            </div>
          </div>
          <div class="mode-group" role="group" aria-labelledby="styleModeLabel">
            <div id="styleModeLabel" class="mode-group-label">Тип жонглирования</div>
            <div class="mode-options" style="--option-count: 4">
              <button type="button" class="mode-option" data-mode="style" data-value="clockwise" aria-pressed="false">По часовой стрелке</button>
              <button type="button" class="mode-option" data-mode="style" data-value="counterclockwise" aria-pressed="false">Против часовой стрелки</button>
              <button type="button" class="mode-option" data-mode="style" data-value="mixed" aria-pressed="false">Mixed</button>
              <button type="button" class="mode-option" data-mode="style" data-value="synchronous" aria-pressed="false">Синхронно</button>
            </div>
          </div>
        </div>
        <div id="modeSummary" class="mode-summary"></div>
      </div>
      <div class="controls" style="margin-top: 14px">
        <button id="btnToggle" class="primary" title="Пробел">▶️ Старт</button>
        <button id="btnStopCycle" type="button" title="Остановить цикл без записи текущей попытки" disabled>⏹ Остановить цикл</button>
        <button id="btnClear">🧹 Очистить таблицу</button>
        <label class="countdown countdown-prestart" title="Отсчёт запуска (3, 5, 7, 10 или 15 сек)">
          Отсчёт перед стартом:
          <input type="range" id="prestart" min="3" max="15" step="1" value="7" list="prestartMarks">
          <output id="prestartOut">7</output> сек
        </label>
        <label class="countdown countdown-min" title="Минимальная длительность попытки для записи">
          Минимум в таблице:
          <input type="number" id="minRecord" min="0" max="3600" step="1" value="10" style="width:72px">
          сек
        </label>
      </div>
      <div class="session-bar" aria-live="polite" aria-atomic="true">
        <div class="session-info">
          <div class="muted" style="margin-bottom:4px">Сессия</div>
          <div id="sessionStatus" class="session-status">Не начата</div>
          <div id="sessionRemaining" class="session-remaining muted"></div>
        </div>
        <div class="session-controls">
          <label>
            <span>Длительность сессии</span>
            <select id="sessionDuration">
              <option value="10">10 минут</option>
              <option value="15" selected>15 минут</option>
              <option value="20">20 минут</option>
              <option value="30">30 минут</option>
            </select>
          </label>
          <button id="btnSessionReset" type="button">♻️ Новая сессия</button>
        </div>
      </div>
      <div id="cdOverlay" class="countdown-overlay" hidden><div class="countdown-digit" id="cdText"></div></div>
    </div>

    <datalist id="prestartMarks">
      <option value="3"></option>
      <option value="5"></option>
      <option value="7"></option>
      <option value="10"></option>
      <option value="15"></option>
    </datalist>

    <div class="card" id="resultsCard">
      <div class="card-header" style="margin-bottom:8px">
        <div class="muted">Все результаты по всем режимам:</div>
        <div class="header-actions">
          <button id="btnDownload" type="button">📸 Скачать скрин таблицы</button>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <caption id="resultsModeSummary" class="table-caption"></caption>
          <thead>
            <tr>
              <th style="width:72px">Мячи</th>
              <th style="width:155px">Руки</th>
              <th style="width:175px">Тип</th>
              <th style="width:52px">№</th>
              <th style="width:100px">Результат</th>
              <th style="width:165px">Метка времени</th>
              <th style="width:46px; text-align:center">×</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="recordCelebration" class="victory-popup" role="dialog" aria-modal="true" aria-labelledby="victoryTitle" aria-describedby="victoryMessage" hidden>
    <div id="victoryConfetti" class="victory-confetti" aria-hidden="true"></div>
    <div class="victory-card">
      <div id="victoryBadge" class="victory-badge"></div>
      <div id="victoryIllustration" class="victory-illustration" aria-hidden="true"></div>
      <div id="victoryTitle" class="victory-title"></div>
      <div id="victoryMessage" class="victory-message"></div>
      <div id="victoryResult" class="victory-result"></div>
      <div id="victoryMode" class="victory-mode"></div>
      <div class="victory-actions">
        <button id="btnVictoryContinue" type="button" class="primary">▶ Продолжить тренировку</button>
        <button id="btnVictoryFinish" type="button">⏹ Закончить на рекорде</button>
      </div>
      <div class="victory-hint">Попытки и время сессии поставлены на паузу</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
  <script>
    // --- Stopwatch logic ---
    let running = false;
    let startTime = 0;      // perf.now() when started
    let elapsedMs = 0;      // accumulated time in ms
    let rafId = null;
    const timeEl = document.getElementById('time');
    const resultsEl = document.getElementById('results');
    const btnToggle = document.getElementById('btnToggle');
    const btnStopCycle = document.getElementById('btnStopCycle');
    const btnClear = document.getElementById('btnClear');
    const btnDownload = document.getElementById('btnDownload');
    const resultsCard = document.getElementById('resultsCard');
    const modeSelectorsEl = document.getElementById('modeSelectors');
    const modeButtons = Array.from(document.querySelectorAll('.mode-option'));
    const modeSummaryEl = document.getElementById('modeSummary');
    const resultsModeSummaryEl = document.getElementById('resultsModeSummary');
    const downloadBtnDefaultText = btnDownload ? btnDownload.textContent : '';
    const recordCelebrationEl = document.getElementById('recordCelebration');
    const victoryConfettiEl = document.getElementById('victoryConfetti');
    const victoryBadgeEl = document.getElementById('victoryBadge');
    const victoryIllustrationEl = document.getElementById('victoryIllustration');
    const victoryTitleEl = document.getElementById('victoryTitle');
    const victoryMessageEl = document.getElementById('victoryMessage');
    const victoryResultEl = document.getElementById('victoryResult');
    const victoryModeEl = document.getElementById('victoryMode');
    const btnVictoryContinue = document.getElementById('btnVictoryContinue');
    const btnVictoryFinish = document.getElementById('btnVictoryFinish');
    let victoryVariantIndex = Math.floor(Math.random() * 6);

    const STORAGE_KEY = 'jpsw_results_v1';
    const SETTINGS_KEY = 'jpsw_settings_v1';
    const MODE_BALLS_OPTIONS = [2, 3, 4];
    const MODE_HAND_OPTIONS = [
      { value: 'left', label: 'только левой рукой' },
      { value: 'right', label: 'только правой рукой' },
      { value: 'both', label: 'двумя руками' },
    ];
    const MODE_STYLE_OPTIONS = [
      { value: 'clockwise', label: 'по часовой стрелке' },
      { value: 'counterclockwise', label: 'против часовой стрелки' },
      { value: 'mixed', label: 'mixed' },
      { value: 'synchronous', label: 'синхронно' },
    ];
    const MODE_DEFAULT_BALLS = 3;
    const MODE_DEFAULT_HANDS = 'both';
    const MODE_DEFAULT_STYLE = 'mixed';
    let selectedBalls = MODE_DEFAULT_BALLS;
    let selectedHands = MODE_DEFAULT_HANDS;
    let selectedStyle = MODE_DEFAULT_STYLE;
    let allResultsByMode = {};
    let minRecordSeconds = 10;
    const SESSION_DEFAULT_MINUTES = 15;
    let sessionDurationMinutes = SESSION_DEFAULT_MINUTES;
    let sessionStartTimestamp = null;
    let sessionElapsedMs = 0;
    let sessionRafId = null;
    let sessionLimitNotified = false;
    let isCelebrationPaused = false;
    let celebrationPauseStartedAt = null;
    let celebrationSessionWasActive = false;

    // Pre-start countdown controls
    const prestartRange = document.getElementById('prestart');
    const prestartOut = document.getElementById('prestartOut');
    const prestartAllowedValues = [3, 5, 7, 10, 15];
    const cdOverlay = document.getElementById('cdOverlay');
    const cdText = document.getElementById('cdText');
    let isCountingDown = false;
    let cdRafId = null;
    let cdStart = 0;
    let cdDurationMs = 0;
    const minRecordInput = document.getElementById('minRecord');
    const sessionDurationSelect = document.getElementById('sessionDuration');
    const sessionStatusEl = document.getElementById('sessionStatus');
    const sessionRemainingEl = document.getElementById('sessionRemaining');
    const btnSessionReset = document.getElementById('btnSessionReset');

    function clampPrestartValue(raw) {
      const numeric = Number(raw);
      if (!Number.isFinite(numeric)) return prestartAllowedValues[0];
      let closest = prestartAllowedValues[0];
      let minDiff = Math.abs(numeric - closest);
      for (let i = 1; i < prestartAllowedValues.length; i += 1) {
        const candidate = prestartAllowedValues[i];
        const diff = Math.abs(numeric - candidate);
        if (diff < minDiff) {
          minDiff = diff;
          closest = candidate;
        }
      }
      return closest;
    }

    function updatePrestartDisplay(value) {
      const snapped = clampPrestartValue(value);
      if (prestartRange) prestartRange.value = String(snapped);
      if (prestartOut) prestartOut.textContent = String(snapped);
    }

    function buildModeKey(balls, hands, style) {
      return `${balls}b_${hands}_${style}`;
    }

    function isValidBalls(value) {
      return MODE_BALLS_OPTIONS.includes(value);
    }

    function isValidHands(value) {
      return MODE_HAND_OPTIONS.some((opt) => opt.value === value);
    }

    function isValidStyle(value) {
      return MODE_STYLE_OPTIONS.some((opt) => opt.value === value);
    }

    function parseModeKey(key) {
      if (typeof key !== 'string') return null;
      const match = key.match(/^(\d+)b_([a-z]+)(?:_([a-z]+))?$/i);
      if (!match) return null;
      const balls = Number(match[1]);
      const hands = match[2].toLowerCase();
      const style = (match[3] ? match[3].toLowerCase() : MODE_DEFAULT_STYLE);
      if (!isValidBalls(balls) || !isValidHands(hands) || !isValidStyle(style)) {
        return null;
      }
      return { balls, hands, style };
    }

    function getBallsLabel(count) {
      const abs = Math.abs(count);
      const mod10 = abs % 10;
      const mod100 = abs % 100;
      let word = 'мячей';
      if (mod10 === 1 && mod100 !== 11) {
        word = 'мяч';
      } else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) {
        word = 'мяча';
      }
      return `${count} ${word}`;
    }

    function getHandsLabel(value) {
      switch (value) {
        case 'left':
          return 'только левой рукой';
        case 'right':
          return 'только правой рукой';
        case 'both':
          return 'двумя руками';
        default:
          return value;
      }
    }

    function getStyleLabel(value) {
      const match = MODE_STYLE_OPTIONS.find((opt) => opt.value === value);
      return match ? match.label : value;
    }

    function getOrCreateModeData(balls, hands, style) {
      const key = buildModeKey(balls, hands, style);
      if (!allResultsByMode[key]) {
        allResultsByMode[key] = [];
      }
      return allResultsByMode[key];
    }

    function getCurrentModeData() {
      return getOrCreateModeData(selectedBalls, selectedHands, selectedStyle);
    }

    function updateModeSummary() {
      if (!modeSummaryEl && !resultsModeSummaryEl) return;
      const ballsText = getBallsLabel(selectedBalls);
      const handsText = getHandsLabel(selectedHands);
      const styleText = getStyleLabel(selectedStyle);
      const summary = `Текущий режим: ${ballsText} · ${handsText} · ${styleText}`;
    
      if (modeSummaryEl) modeSummaryEl.textContent = summary;
      if (resultsModeSummaryEl) {
        resultsModeSummaryEl.textContent = 'Общая таблица · рекорд рассчитывается отдельно для каждого режима';
      }
    }

    function applyModeToControls() {
      modeButtons.forEach((button) => {
        const dimension = button.dataset.mode;
        let currentValue = '';
        if (dimension === 'balls') currentValue = String(selectedBalls);
        if (dimension === 'hands') currentValue = selectedHands;
        if (dimension === 'style') currentValue = selectedStyle;
        button.setAttribute('aria-pressed', String(button.dataset.value === currentValue));
      });
    }

    function applySessionControls() {
      if (sessionDurationSelect) {
        sessionDurationSelect.value = String(sessionDurationMinutes);
      }
      renderSession();
    }

    function switchMode(newBalls, newHands, newStyle) {
      if (!isValidBalls(newBalls) || !isValidHands(newHands) || !isValidStyle(newStyle)) {
        return;
      }
      if (newBalls === selectedBalls && newHands === selectedHands && newStyle === selectedStyle) {
        return;
      }
      selectedBalls = newBalls;
      selectedHands = newHands;
      selectedStyle = newStyle;
      applyModeToControls();
      updateModeSummary();
      renderResults();
      persistSettings();
      persistResults();
    }

    if (prestartRange) {
      updatePrestartDisplay(prestartRange.value);
      prestartRange.addEventListener('input', (event) => {
        updatePrestartDisplay(event.target.value);
      });
      prestartRange.addEventListener('change', (event) => {
        updatePrestartDisplay(event.target.value);
      });
    }

    function pad(n, len=2) { return String(n).padStart(len, '0'); }
    function formatTime(ms) {
      ms = Math.max(0, Math.floor(ms));
      const totalSec = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSec / 60);   // минуты накапливаются: 0,1,2,…,120…
      const seconds = totalSec % 60;
      return `${pad(minutes)}:${pad(seconds)}`;
    }

    function formatTimeLong(ms) {
      ms = Math.max(0, Math.floor(ms));
      const totalSec = Math.floor(ms / 1000);
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      if (hours > 0) return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      return `${pad(minutes)}:${pad(seconds)}`;
    }

    function render() {
      if (timeEl) timeEl.textContent = formatTime(elapsedMs);
    }

    function renderSession(forceExpired = false) {
      if (!sessionStatusEl || !sessionRemainingEl) return;
      const targetMs = Math.max(0, sessionDurationMinutes * 60 * 1000);
      if (sessionStartTimestamp === null) {
        sessionStatusEl.textContent = 'Не начата';
        sessionRemainingEl.textContent = targetMs ? `Лимит: ${formatTimeLong(targetMs)}` : '';
        return;
      }
      const elapsed = Math.min(targetMs, Math.max(0, sessionElapsedMs));
      const remaining = Math.max(0, targetMs - elapsed);
      sessionStatusEl.textContent = `Прошло ${formatTimeLong(elapsed)} из ${formatTimeLong(targetMs)}`;
      if (forceExpired || remaining <= 0) {
        sessionRemainingEl.textContent = 'Лимит достигнут — нажмите «Новая сессия»';
      } else {
        sessionRemainingEl.textContent = `Осталось ${formatTimeLong(remaining)}`;
      }
    }

    function startSessionTicker() {
      if (sessionRafId !== null) cancelAnimationFrame(sessionRafId);
      sessionRafId = requestAnimationFrame(sessionTick);
    }

    function startSessionIfNeeded() {
      if (sessionStartTimestamp !== null) return;
      sessionStartTimestamp = performance.now();
      sessionElapsedMs = 0;
      sessionLimitNotified = false;
      renderSession();
      startSessionTicker();
    }

    function sessionTick(now) {
      if (sessionStartTimestamp === null || isCelebrationPaused) return;
      sessionElapsedMs = now - sessionStartTimestamp;
      if (isSessionExpired()) {
        handleSessionExpired();
        return;
      }
      renderSession();
      sessionRafId = requestAnimationFrame(sessionTick);
    }

    function isSessionExpired() {
      if (sessionStartTimestamp === null) return false;
      const targetMs = Math.max(0, sessionDurationMinutes * 60 * 1000);
      return sessionElapsedMs >= targetMs && targetMs > 0;
    }

    function handleSessionExpired() {
      if (sessionRafId !== null) cancelAnimationFrame(sessionRafId);
      sessionRafId = null;
      const targetMs = Math.max(0, sessionDurationMinutes * 60 * 1000);
      sessionElapsedMs = targetMs;
      renderSession(true);
      cancelCountdown();
      if (running) pause();
      if (!sessionLimitNotified) {
        alert('Время сессии истекло. Нажмите «Новая сессия», чтобы продолжить.');
        sessionLimitNotified = true;
      }
    }

    function resetSession(restartIfRunning = false) {
      if (sessionRafId !== null) cancelAnimationFrame(sessionRafId);
      sessionRafId = null;
      sessionStartTimestamp = null;
      sessionElapsedMs = 0;
      sessionLimitNotified = false;
      renderSession();
      if (restartIfRunning && running) {
        startSessionIfNeeded();
      }
    }

    function updatePrimaryButton() {
      if (btnStopCycle) {
        btnStopCycle.disabled = !isCountingDown && !running && elapsedMs === 0;
      }
      if (!btnToggle) return;
      btnToggle.classList.remove('primary');
      if (isCountingDown) {
        btnToggle.textContent = '⏭ Начать сейчас';
        btnToggle.classList.add('primary');
        btnToggle.title = 'Пробел (пропустить отсчёт)';
      } else if (running) {
        btnToggle.textContent = '⏹ Завершить и повторить';
        btnToggle.classList.add('primary');
        btnToggle.title = 'Пробел (записать результат и начать следующую попытку)';
      } else if (elapsedMs > 0) {
        btnToggle.textContent = '💾 Записать и сбросить';
        btnToggle.classList.add('primary');
        btnToggle.title = 'Пробел (записать и сбросить)';
      } else {
        btnToggle.textContent = '▶️ Старт';
        btnToggle.classList.add('primary');
        btnToggle.title = 'Пробел';
      }
    }

    function tick(now) {
      elapsedMs = now - startTime;
      render();
      rafId = requestAnimationFrame(tick);
    }

    function start() {
      if (isCelebrationPaused) return;
      if (isSessionExpired()) {
        handleSessionExpired();
        return;
      }
      startSessionIfNeeded();
      running = true;
      startTime = performance.now() - elapsedMs; // resume from paused value
      rafId = requestAnimationFrame(tick);
      updatePrimaryButton();
    }

    function pause() {
      running = false;
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = null;
      render();
      updatePrimaryButton();
    }

    function stopCycle() {
      cancelCountdown();
      running = false;
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = null;
      elapsedMs = 0;
      render();
      updatePrimaryButton();
    }

    function beginAttempt() {
      if (isSessionExpired()) {
        handleSessionExpired();
        return;
      }
      const secs = prestartRange ? clampPrestartValue(prestartRange.value) : 0;
      if (secs > 0) {
        beginCountdown(secs);
      } else {
        start();
      }
    }

    function handlePrimaryAction() {
      if (isCelebrationPaused) return;
      if (isCountingDown) {
        // Space during countdown: skip countdown and start immediately.
        cancelCountdown();
        start();
        return;
      }
      if (running) {
        finishAndRestart();
        return;
      }
      if (elapsedMs > 0) {
        // A stopped value can remain only after an interrupted or expired session.
        resetAndLog();
        return;
      }
      beginAttempt();
    }

    function resetAndLog() {
      cancelCountdown();
      if (running) {
        elapsedMs = performance.now() - startTime;
        pause();
      }
      const completedMs = elapsedMs;
      const didCelebrate = addResultEntry(completedMs);
      elapsedMs = 0;
      render();
      updatePrimaryButton();
      return didCelebrate;
    }

    function finishAndRestart() {
      const didCelebrate = resetAndLog();
      if (didCelebrate) return;
      if (isSessionExpired()) {
        handleSessionExpired();
        return;
      }
      beginAttempt();
    }

    function persistResults() {
      if (typeof localStorage === 'undefined') return;
      try {
        const payload = {};
        Object.keys(allResultsByMode).forEach((key) => {
          const arr = allResultsByMode[key];
          if (!Array.isArray(arr) || arr.length === 0) return;
          const sanitized = arr
            .map((item) => {
              try {
                return sanitizeStoredEntry(item);
              } catch (err) {
                return null;
              }
            })
            .filter(Boolean);
          if (sanitized.length > 0) {
            payload[key] = sanitized;
          }
        });
        const modeKeys = Object.keys(payload);
        if (modeKeys.length === 0) {
          localStorage.removeItem(STORAGE_KEY);
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        }
      } catch (err) {
        console.warn('Не удалось сохранить результаты в localStorage', err);
      }
    }

    function formatStamp(stamp) {
      try {
        const d = stamp ? new Date(stamp) : new Date();
        if (Number.isNaN(d.getTime())) return '';
        const year   = d.getFullYear();
        const month  = pad(d.getMonth() + 1);
        const day    = pad(d.getDate());
        const hours  = pad(d.getHours());
        const minute = pad(d.getMinutes());
        return `${year}-${month}-${day} ${hours}:${minute}`;
      } catch (err) {
        return stamp || '';
      }
    }

    function getAllResultRows() {
      const rows = [];
      Object.keys(allResultsByMode).forEach((modeKey) => {
        const mode = parseModeKey(modeKey);
        const modeData = allResultsByMode[modeKey];
        if (!mode || !Array.isArray(modeData)) return;
        modeData.forEach((entry, modeIndex) => {
          rows.push({ entry, mode, modeKey, modeIndex });
        });
      });
      rows.sort((a, b) => {
        const timeA = Date.parse(a.entry.stamp || '') || 0;
        const timeB = Date.parse(b.entry.stamp || '') || 0;
        return timeB - timeA;
      });
      return rows;
    }

    function getBestMsByMode() {
      const bestByMode = {};
      Object.keys(allResultsByMode).forEach((modeKey) => {
        const modeData = allResultsByMode[modeKey];
        if (!Array.isArray(modeData) || modeData.length === 0) return;
        bestByMode[modeKey] = modeData.reduce((best, entry) => Math.max(best, entry.ms), 0);
      });
      return bestByMode;
    }

    function renderResults() {
      if (!resultsEl) return;
      resultsEl.innerHTML = '';
      const fragment = document.createDocumentFragment();
      const rows = getAllResultRows();
      const bestByMode = getBestMsByMode();
      const totalEntries = rows.length;

      rows.forEach((row, index) => {
        const { entry, mode, modeKey, modeIndex } = row;
        const tr = document.createElement('tr');
        tr.dataset.modeKey = modeKey;
        tr.dataset.index = String(modeIndex);
        const isCurrentRecord = entry.ms === bestByMode[modeKey];
        if (isCurrentRecord) {
          tr.classList.add('current-record');
          tr.title = 'Текущий рекорд этого режима';
        }

        const tdBalls = document.createElement('td');
        tdBalls.textContent = getBallsLabel(mode.balls);

        const tdHands = document.createElement('td');
        tdHands.textContent = getHandsLabel(mode.hands);

        const tdStyle = document.createElement('td');
        tdStyle.textContent = getStyleLabel(mode.style);

        const tdN = document.createElement('td');
        tdN.textContent = String(totalEntries - index);

        const tdTime = document.createElement('td');
        tdTime.textContent = (isCurrentRecord ? '🏆 ' : '') + formatTime(entry.ms);

        const tdStamp = document.createElement('td');
        tdStamp.textContent = formatStamp(entry.stamp);

        const tdDel = document.createElement('td');
        tdDel.style.textAlign = 'center';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'icon del';
        btn.setAttribute('aria-label', 'Удалить строку');
        btn.textContent = '×';
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          const idx = parseInt(tr.dataset.index || '-1', 10);
          removeResult(tr.dataset.modeKey || '', idx);
        });
        tdDel.appendChild(btn);

        tr.appendChild(tdBalls);
        tr.appendChild(tdHands);
        tr.appendChild(tdStyle);
        tr.appendChild(tdN);
        tr.appendChild(tdTime);
        tr.appendChild(tdStamp);
        tr.appendChild(tdDel);
        fragment.appendChild(tr);
      });
      resultsEl.appendChild(fragment);
    }

    function addResultEntry(ms) {
      const minMs = Math.max(0, Math.floor(minRecordSeconds * 1000));
      if (ms < minMs) {
        window.scrollTo(0, 0);
        renderResults();
        return false;
      }
      const entry = {
        ms: Math.max(0, Math.floor(ms)),
        stamp: new Date().toISOString(),
      };
      const modeData = getCurrentModeData();
      const previousBestMs = modeData.length > 0
        ? modeData.reduce((best, item) => Math.max(best, item.ms), 0)
        : null;
      const isNewRecord = previousBestMs === null || entry.ms > previousBestMs;
      modeData.unshift(entry);
      persistResults();
      renderResults();
      window.scrollTo(0, 0);
      if (isNewRecord) {
        showRecordCelebration(entry.ms, previousBestMs);
      }
      return isNewRecord;
    }

    function removeResult(modeKey, index) {
      const modeData = allResultsByMode[modeKey];
      if (!Array.isArray(modeData) || !Number.isInteger(index) || index < 0 || index >= modeData.length) return;
      modeData.splice(index, 1);
      persistResults();
      renderResults();
    }

    function clearResults() {
      allResultsByMode = {};
      persistResults();
      renderResults();
    }

    function sanitizeStoredEntry(entry) {
      if (!entry || typeof entry !== 'object') return null;
      const ms = Number(entry.ms);
      if (!Number.isFinite(ms)) return null;
      const normalized = {
        ms: Math.max(0, Math.floor(ms)),
        stamp: typeof entry.stamp === 'string' ? entry.stamp : '',
      };
      return normalized;
    }

    function sanitizeStoredArray(arr) {
      if (!Array.isArray(arr)) return [];
      const sanitized = arr
        .map((item) => {
          try {
            return sanitizeStoredEntry(item);
          } catch (err) {
            return null;
          }
        })
        .filter(Boolean);
      sanitized.sort((a, b) => {
        const timeA = Date.parse(a.stamp || '') || 0;
        const timeB = Date.parse(b.stamp || '') || 0;
        return timeB - timeA;
      });
      return sanitized;
    }

    function persistSettings() {
      if (typeof localStorage === 'undefined') return;
      const payload = {
        minRecordSeconds,
        selectedBalls,
        selectedHands,
        selectedStyle,
        sessionDurationMinutes,
      };
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
      } catch (err) {
        console.warn('Не удалось сохранить настройки в localStorage', err);
      }
    }

    function restoreSettingsFromStorage() {
      selectedBalls = MODE_DEFAULT_BALLS;
      selectedHands = MODE_DEFAULT_HANDS;
      selectedStyle = MODE_DEFAULT_STYLE;
      if (typeof localStorage === 'undefined') {
        if (minRecordInput) minRecordInput.value = String(minRecordSeconds);
        return;
      }
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) {
          if (minRecordInput) minRecordInput.value = String(minRecordSeconds);
          return;
        }
        const parsed = JSON.parse(raw);
        const candidate = parsed && typeof parsed === 'object' ? Number(parsed.minRecordSeconds) : NaN;
        if (Number.isFinite(candidate) && candidate >= 0) {
          const clamped = Math.min(3600, candidate);
          minRecordSeconds = Math.round(clamped);
        }
        const storedDuration = parsed && typeof parsed === 'object' ? Number(parsed.sessionDurationMinutes) : NaN;
        if (Number.isFinite(storedDuration) && storedDuration > 0) {
          sessionDurationMinutes = Math.min(999, Math.max(1, Math.round(storedDuration)));
        }
        if (parsed && typeof parsed === 'object') {
          const candidateBalls = Number(parsed.selectedBalls);
          if (Number.isFinite(candidateBalls) && isValidBalls(candidateBalls)) {
            selectedBalls = candidateBalls;
          }
          const candidateHands = typeof parsed.selectedHands === 'string' ? parsed.selectedHands : '';
          if (isValidHands(candidateHands)) {
            selectedHands = candidateHands;
          }
          const candidateStyle = typeof parsed.selectedStyle === 'string' ? parsed.selectedStyle : '';
          if (isValidStyle(candidateStyle)) {
            selectedStyle = candidateStyle;
          }
        }
      } catch (err) {
        console.warn('Не удалось прочитать настройки из localStorage', err);
      }
      if (minRecordInput) minRecordInput.value = String(minRecordSeconds);
    }

    function restoreResultsFromStorage() {
      allResultsByMode = {};
      if (typeof localStorage === 'undefined') {
        renderResults();
        return;
      }
      let shouldPersist = false;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            const sanitized = sanitizeStoredArray(parsed);
            const legacyKey = buildModeKey(MODE_DEFAULT_BALLS, MODE_DEFAULT_HANDS, MODE_DEFAULT_STYLE);
            allResultsByMode[legacyKey] = sanitized;
            shouldPersist = true;
          } else if (parsed && typeof parsed === 'object') {
            Object.keys(parsed).forEach((key) => {
              try {
                const sanitized = sanitizeStoredArray(parsed[key]);
                const parsedKey = parseModeKey(key);
                const target = parsedKey
                  ? buildModeKey(parsedKey.balls, parsedKey.hands, parsedKey.style)
                  : buildModeKey(MODE_DEFAULT_BALLS, MODE_DEFAULT_HANDS, MODE_DEFAULT_STYLE);
                allResultsByMode[target] = sanitized;
                if (!parsedKey || target !== key) {
                  shouldPersist = true;
                }
              } catch (err) {
                // ignore malformed entries
              }
            });
          }
        }
      } catch (err) {
        console.warn('Не удалось прочитать результаты из localStorage', err);
        allResultsByMode = {};
      }
      renderResults();
      if (shouldPersist) {
        persistResults();
      }
    }

      btnDownload.textContent = '⏳ Подготовка...';
      try {
        const canvas = await window.html2canvas(resultsCard, {
          backgroundColor: '#0f1220',

          useCORS: true,
        });

        const modeKey = buildModeKey(selectedBalls, selectedHands, selectedStyle);

        link.href = canvas.toDataURL('image/png');

        btnDownload.disabled = false;
        btnDownload.textContent = downloadBtnDefaultText || '📸 Скачать скрин таблицы';

          return '<svg viewBox="0 0 180 126" xmlns="http://www.w3.org/2000/svg"><path d="M18 108 66 42l18 24 22-38 56 80H18Z" fill="currentColor" opacity=".24"/><path d="m18 108 48-66 18 24 22-38 56 80" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M106 28v-18m0 2h34l-9 11 9 11h-34" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="66" cy="42" r="7" fill="currentColor"/></svg>';
        case 'level':
          return '<svg viewBox="0 0 180 126" xmlns="http://www.w3.org/2000/svg"><path d="M38 100h104" stroke="currentColor" stroke-width="8" stroke-linecap="round" opacity=".3"/><path d="M55 92V61m0 0L38 78m17-17 17 17M90 92V42m0 0L71 61m19-19 19 19m16 31V24m0 0-20 21m20-21 20 21" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="125" cy="24" r="9" fill="currentColor"/></svg>';
        case 'flame':
          return '<svg viewBox="0 0 180 126" xmlns="http://www.w3.org/2000/svg"><path d="M92 112c-30 0-49-18-47-45 2-20 16-32 33-50-2 18 9 22 14 35 8-16 23-22 19-42 25 21 33 42 25 65-7 23-22 37-44 37Z" fill="currentColor" opacity=".25"/><path d="M91 111c-21 0-34-13-33-31 1-14 10-22 22-35-1 13 7 16 11 25 6-11 16-15 14-29 17 15 22 29 17 46-5 15-15 24-31 24Z" fill="currentColor"/><path d="M91 104c-9 0-15-6-14-14 1-6 5-10 10-16 0 6 3 8 5 12 3-5 7-7 6-13 8 7 10 13 8 21-2 6-7 10-15 10Z" fill="#fff" opacity=".82"/></svg>';
        case 'rocket':
          return '<svg viewBox="0 0 180 126" xmlns="http://www.w3.org/2000/svg"><path d="M70 84c-12 6-22 17-27 31 15-3 28-10 35-21" fill="currentColor" opacity=".35"/><path d="M104 80c8 4 17 12 22 23 4-13 3-26-2-35M67 47c-10 3-21 10-29 21 12 2 25 0 35-5" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M69 72c5-30 27-54 64-62-2 36-20 61-50 73L69 72Z" fill="currentColor" opacity=".28"/><path d="M69 72c5-30 27-54 64-62-2 36-20 61-50 73L69 72Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><circle cx="110" cy="36" r="10" fill="#fff" opacity=".86"/></svg>';
        case 'crown':
          return '<svg viewBox="0 0 180 126" xmlns="http://www.w3.org/2000/svg"><path d="m31 40 32 26 27-45 27 45 32-26-13 67H44L31 40Z" fill="currentColor" opacity=".28"/><path d="m31 40 32 26 27-45 27 45 32-26-13 67H44L31 40Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 87h86" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><circle cx="31" cy="40" r="8" fill="currentColor"/><circle cx="90" cy="21" r="8" fill="currentColor"/><circle cx="149" cy="40" r="8" fill="currentColor"/></svg>';
        default:
          return '<svg viewBox="0 0 180 126" xmlns="http://www.w3.org/2000/svg"><circle cx="90" cy="63" r="52" fill="currentColor" opacity=".16"/><path d="m98 8-48 63h34l-8 47 54-70H96L98 8Z" fill="currentColor"/><path d="M33 24 21 12m126 12 12-12M26 104l-14 10m142-10 14 10" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>';
      }
    }

    function formatRecordImprovement(ms) {
      const seconds = Math.max(0, ms) / 1000;
      const precision = seconds < 10 ? 1 : 0;
      return seconds.toFixed(precision).replace('.', ',');
    }

    function createVictoryConfetti(variant) {
      if (!victoryConfettiEl) return;
      victoryConfettiEl.innerHTML = '';
      const colors = [variant.accent, variant.accent2, '#ff7aa8', '#72e6b1', '#ffffff'];
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < 40; i += 1) {
        const piece = document.createElement('span');
        piece.className = 'confetti-piece';
        piece.style.left = String(Math.random() * 100) + '%';
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty('--delay', String(Math.random() * .65) + 's');
        piece.style.setProperty('--duration', String(2.3 + Math.random() * 1.45) + 's');
        piece.style.setProperty('--drift', String(-100 + Math.random() * 200) + 'px');
        piece.style.width = String(7 + Math.random() * 7) + 'px';
        piece.style.height = String(10 + Math.random() * 13) + 'px';
        fragment.appendChild(piece);
      }
      victoryConfettiEl.appendChild(fragment);
    }

    function playApplauseSound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      try {
        const context = new AudioContextClass();
        const master = context.createGain();
        master.gain.setValueAtTime(.16, context.currentTime);
        master.connect(context.destination);
        const startAt = context.currentTime + .01;

        for (let i = 0; i < 30; i += 1) {
          const clapLength = Math.floor(context.sampleRate * (.055 + Math.random() * .045));
          const buffer = context.createBuffer(1, clapLength, context.sampleRate);
          const channel = buffer.getChannelData(0);
          for (let sample = 0; sample < clapLength; sample += 1) {
            const envelope = Math.pow(1 - sample / clapLength, 2.6);
            channel[sample] = (Math.random() * 2 - 1) * envelope;
          }

          const source = context.createBufferSource();
          const filter = context.createBiquadFilter();
          const gain = context.createGain();
          const clapAt = startAt + (i / 30) * 2.35 + Math.random() * .11;
          filter.type = 'bandpass';
          filter.frequency.value = 1150 + Math.random() * 1900;
          filter.Q.value = .65;
          gain.gain.setValueAtTime(.0001, clapAt);
          gain.gain.linearRampToValueAtTime(.55 + Math.random() * .35, clapAt + .008);
          gain.gain.exponentialRampToValueAtTime(.0001, clapAt + .11);
          source.buffer = buffer;
          source.connect(filter);
          filter.connect(gain);
          gain.connect(master);
          source.start(clapAt);
          source.stop(clapAt + .12);
        }

        if (context.state === 'suspended') {
          context.resume().catch(() => {});
        }
        window.setTimeout(() => {
          context.close().catch(() => {});
        }, 3100);
      } catch (err) {
        console.warn('Не удалось воспроизвести аплодисменты', err);
      }
    }

    function pauseSessionForCelebration() {
      const now = performance.now();
      isCelebrationPaused = true;
      celebrationPauseStartedAt = now;
      celebrationSessionWasActive = sessionStartTimestamp !== null && !isSessionExpired();
      if (sessionRafId !== null) cancelAnimationFrame(sessionRafId);
      sessionRafId = null;
      if (celebrationSessionWasActive) {
        sessionElapsedMs = now - sessionStartTimestamp;
        renderSession();
      }
    }

    function resumeSessionAfterCelebration() {
      const now = performance.now();
      if (celebrationSessionWasActive && sessionStartTimestamp !== null && celebrationPauseStartedAt !== null) {
        sessionStartTimestamp += now - celebrationPauseStartedAt;
        sessionElapsedMs = now - sessionStartTimestamp;
      }
      isCelebrationPaused = false;
      celebrationPauseStartedAt = null;
      const shouldResumeSession = celebrationSessionWasActive && sessionStartTimestamp !== null;
      celebrationSessionWasActive = false;
      if (shouldResumeSession) {
        renderSession();
        startSessionTicker();
      }
    }

    function showRecordCelebration(ms, previousBestMs) {
      if (!recordCelebrationEl) return;
      pauseSessionForCelebration();
      const variant = VICTORY_VARIANTS[victoryVariantIndex % VICTORY_VARIANTS.length];
      victoryVariantIndex += 1;
      recordCelebrationEl.style.setProperty('--victory-accent', variant.accent);
      recordCelebrationEl.style.setProperty('--victory-accent-2', variant.accent2);
      if (victoryBadgeEl) victoryBadgeEl.textContent = variant.badge;
      if (victoryIllustrationEl) victoryIllustrationEl.innerHTML = getVictoryIllustration(variant.illustration);
      if (victoryTitleEl) victoryTitleEl.textContent = variant.title;
      if (victoryMessageEl) victoryMessageEl.textContent = variant.message;
      if (victoryResultEl) {
        if (previousBestMs === null) {
          victoryResultEl.textContent = formatTime(ms) + ' · первый рекорд режима';
        } else {
          const improvement = formatRecordImprovement(ms - previousBestMs);
          victoryResultEl.textContent = formatTime(ms) + ' · лучше на ' + improvement + ' сек';
        }
      }
      if (victoryModeEl) {
        victoryModeEl.textContent = getBallsLabel(selectedBalls) + ' · ' + getHandsLabel(selectedHands) + ' · ' + getStyleLabel(selectedStyle);
      }
      createVictoryConfetti(variant);
      recordCelebrationEl.hidden = false;
      recordCelebrationEl.classList.remove('show');
      void recordCelebrationEl.offsetWidth;
      recordCelebrationEl.classList.add('show');
      playApplauseSound();
      if (btnVictoryContinue) btnVictoryContinue.focus({ preventScroll: true });
    }

    function closeRecordCelebration(continueTraining) {
      if (!isCelebrationPaused) return;
      if (recordCelebrationEl) {
        recordCelebrationEl.classList.remove('show');
        recordCelebrationEl.hidden = true;
      }
      if (victoryConfettiEl) victoryConfettiEl.innerHTML = '';
      if (continueTraining) {
        resumeSessionAfterCelebration();
        beginAttempt();
      } else {
        isCelebrationPaused = false;
        celebrationPauseStartedAt = null;
        celebrationSessionWasActive = false;
        resetSession(false);
        updatePrimaryButton();
      }
    }

    function beginCountdown(secs) {
      if (!cdOverlay) { start(); return; }
      isCountingDown = true;
      cdDurationMs = Math.max(0, (secs|0) * 1000);
      cdStart = performance.now();
      cdOverlay.hidden = false;
      updateCountdownText(cdDurationMs);
      updatePrimaryButton();
      cdRafId = requestAnimationFrame(countdownTick);
    }
    function countdownTick(now) {
      const elapsed = now - cdStart;
      const remain = Math.max(0, cdDurationMs - elapsed);
      updateCountdownText(remain);
      if (remain <= 0) {
        cancelCountdown();
        start();
        return;
      }
      cdRafId = requestAnimationFrame(countdownTick);
    }
    function updateCountdownText(remainMs) {
      if (!cdText) return;
      // Show only 3..2..1 (no "Старт!" overlay to avoid sticking)
      if (remainMs <= 0) return;
      const remainingWhole = Math.max(1, Math.ceil(remainMs / 1000));
      cdText.textContent = String(remainingWhole);
    }
    function cancelCountdown() {
      if (!isCountingDown) return;
      isCountingDown = false;
      if (cdRafId !== null) cancelAnimationFrame(cdRafId);
      cdRafId = null;
      if (cdOverlay) { cdOverlay.hidden = true; }
      if (cdText) { cdText.textContent = ''; }
      updatePrimaryButton();
    }

    // --- Keyboard controls ---
    function isTypingTarget(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toUpperCase();
      if (el.isContentEditable) return true;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return true;
      return false;
    }
    window.addEventListener('keydown', (e) => {
      // Ignore key repeat to avoid flicker on long press
      if (e.repeat) return;
      if (isCelebrationPaused && e.key === 'Escape') {
        e.preventDefault();
        closeRecordCelebration(false);
        return;
      }
      // Ignore shortcuts when user interacts with inputs/controls (e.g., range slider)
      if (isTypingTarget(e.target)) return;
      if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault(); // prevent page scroll on space
        handlePrimaryAction();
      }
    }, { passive: false });

    restoreSettingsFromStorage();
    applyModeToControls();
    applySessionControls();
    restoreResultsFromStorage();
    updateModeSummary();

    // --- Buttons as mouse fallback ---
    if (btnToggle) btnToggle.addEventListener('click', handlePrimaryAction);
    if (btnStopCycle) btnStopCycle.addEventListener('click', stopCycle);
    if (btnClear) btnClear.addEventListener('click', clearResults);
    if (btnDownload) btnDownload.addEventListener('click', downloadTableScreenshot);
    if (btnVictoryContinue) {
      btnVictoryContinue.addEventListener('click', () => closeRecordCelebration(true));
    }
    if (btnVictoryFinish) {
      btnVictoryFinish.addEventListener('click', () => closeRecordCelebration(false));
    }

    if (modeSelectorsEl) {
      modeSelectorsEl.addEventListener('click', (event) => {
        const button = event.target.closest('.mode-option');
        if (!button || !modeSelectorsEl.contains(button)) return;
        const dimension = button.dataset.mode;
        const value = button.dataset.value || '';
        if (dimension === 'balls') {
          const balls = Number(value);
          if (isValidBalls(balls)) switchMode(balls, selectedHands, selectedStyle);
        } else if (dimension === 'hands' && isValidHands(value)) {
          switchMode(selectedBalls, value, selectedStyle);
        } else if (dimension === 'style' && isValidStyle(value)) {
          switchMode(selectedBalls, selectedHands, value);
        }
        if (event.detail > 0) button.blur();
      });
    }

    if (minRecordInput) {
      minRecordInput.addEventListener('input', () => {
        const val = Number(minRecordInput.value);
        if (!Number.isFinite(val) || val < 0) return;
        const clamped = Math.min(3600, val);
        const rounded = Math.round(clamped);
        minRecordSeconds = rounded;
        minRecordInput.value = String(rounded);
        persistSettings();
      });
    }

    if (sessionDurationSelect) {
      sessionDurationSelect.addEventListener('change', () => {
        const minutes = Number(sessionDurationSelect.value);
        if (!Number.isFinite(minutes) || minutes <= 0) {
          applySessionControls();
          return;
        }
        sessionDurationMinutes = Math.min(999, Math.max(1, Math.round(minutes)));
        persistSettings();
        renderSession();
        if (sessionStartTimestamp !== null && isSessionExpired()) {
          handleSessionExpired();
        }
      });
    }

    if (btnSessionReset) {
      btnSessionReset.addEventListener('click', () => {
        resetSession(true);
      });
    }

    // Initial render
    render();
    updatePrimaryButton();
    renderSession();
  </script>
</body>
</html>
